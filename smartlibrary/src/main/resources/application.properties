spring.application.name=smartlibrary

# Base de datos H2 en memoria (se reinicia cada vez que arranca la aplicacion)
spring.datasource.url=jdbc:h2:mem:smartlibrary
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Ejecuta data.sql despues de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true

# Consola web de H2: /h2-console en el puerto que muestre la aplicacion al arrancar (JDBC URL: jdbc:h2:mem:smartlibrary)
spring.h2.console.enabled=true
